server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/paydue
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

paydue:
  jwt:
    secret: paydue-dev-secret-change-me-to-a-long-random-value-32b
    expiration-ms: 86400000
