<div class="shell">
  <header class="topbar">
    <a class="brand" [routerLink]="auth.homePath()">
      <span class="brand-mark">Pd</span>
      PayDue
    </a>
    @if (auth.user(); as user) {
      <span class="role-chip">{{ roleLabel(user.role) }}</span>
      <span class="user-email">{{ user.email }}</span>
      <button class="ghost-link" type="button" (click)="logout()">Sign out</button>
    }
  </header>
  <main class="shell-main">
    <router-outlet />
  </main>
</div>
